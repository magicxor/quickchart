name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  e2e:
    name: E2E tests (Docker)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run E2E tests
        # Docker Hub pulls from shared runners flake regularly (timeouts, rate
        # limits) and testcontainers hides the underlying build error. Retry
        # once; the retry reuses cached layers and runs with debug logging so
        # a genuine failure is diagnosable from the job log.
        run: |
          npm run test:e2e || {
            echo "::warning::E2E suite failed once; retrying with testcontainers debug logging"
            DEBUG='testcontainers*' npm run test:e2e
          }
        env:
          # The Ryuk cleanup sidecar needs a Docker Hub pull on every run - a
          # recurring source of network/rate-limit flakes. CI runners are
          # ephemeral and the suite stops its container itself, so skip it.
          TESTCONTAINERS_RYUK_DISABLED: 'true'
