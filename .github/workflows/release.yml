# On every v-prefixed semver tag (v1.2.3 / v1.2.3-rc1):
# Builds and pushes the multi-arch (amd64+arm64) QuickChart image to GHCR:
#   ghcr.io/<owner>/quickchart:{version,latest}
# Each arch is built natively on its own runner and pushed by digest,
# then the digests are merged into one multi-arch manifest list.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-image:
    name: Build quickchart (${{ matrix.runner.arch }})
    strategy:
      fail-fast: false
      matrix:
        runner:
          - { os: ubuntu-26.04, arch: amd64 }
          - { os: ubuntu-26.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.runner.arch }}
          cache-from: type=gha,scope=quickchart-${{ matrix.runner.arch }}
          cache-to: type=gha,scope=quickchart-${{ matrix.runner.arch }},mode=max
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/quickchart,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.runner.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-manifests:
    name: Merge manifests
    needs: build-image
    runs-on: ubuntu-26.04
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/quickchart
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect image
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
